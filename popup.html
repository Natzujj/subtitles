<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div class="config-wrapper">
    <button id="toggleConfig" title="Configurações"></button>
    <div id="configPanel" class="config-panel hidden">
      <label class="config-option checkbox-label">
        <input type="checkbox" id="overlay"><span>Legenda na tela</span>
      </label>
      <label class="config-option">
        <span>Tamanho da legenda</span>
        <input type="range" id="size" min="16" max="60" step="2">
      </label>
    </div>
  </div>

  <h3>Legendas ao Vivo</h3>

  <div class="config-option">
    <label for="lang">Idioma da legenda</label>
    <select id="lang"></select>
  </div>

  <div id="status" class="status">…</div>
  <div id="hint" class="hint hidden"></div>

  <button id="toggle">Iniciar nesta aba</button>
  <button id="conv" class="btn-teal">Abrir modo conversa</button>
  <script src="popup.js"></script>
</body></html>
