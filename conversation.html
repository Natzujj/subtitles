<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><title>Conversa</title>
<link rel="stylesheet" href="style.css">
<style>
  body.conv { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
  .conv header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #d1d1d1; }
  .conv header h3 { margin: 0; flex: 1; text-align: left; }
  .conv header button { width: auto; margin: 0; padding: 6px 10px; }
  #list { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .line { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 4px rgba(0,0,0,.03); }
  .ts { font-size: 11px; color: #6b7785; margin-right: 8px; }
  .tr { display: block; color: #3f51b5; font-size: 13px; margin-top: 2px; }
  #live { padding: 10px 16px; min-height: 2.6em; background: #fff; border-top: 1px solid #d1d1d1; color: #6b7785; font-style: italic; }
</style></head>
<body class="conv">
  <header>
    <h3>Conversa</h3>
    <button id="copy">Copiar</button>
    <button id="save" class="btn-teal">Baixar .txt</button>
    <button id="clear" class="btn-danger">Limpar</button>
  </header>
  <div id="list"></div>
  <div id="live"></div>
  <script src="conversation.js"></script>
</body></html>
